<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ACI606 Cloud Fleet Dashboard</title>
  <style>
    :root { font-family: Inter, system-ui, sans-serif; color-scheme: dark; }
    body { margin: 0; background:#0d1117; color:#e6edf3; }
    header { padding:22px 28px; border-bottom:1px solid #30363d; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;}
    h1 { margin:0; font-size:22px; }
    .tag { color:#8b949e; font-size:14px; margin-top:4px;}
    .status-bar { display:flex; gap:15px; font-size:14px; }
    .status-item { background:#161b22; padding:6px 12px; border-radius:8px; border:1px solid #30363d;}
    main { padding:28px; }
    .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px; }
    .card { border:1px solid #30363d; border-radius:14px; padding:18px; background:#161b22; transition: transform 0.2s;}
    .card:hover { transform: translateY(-2px); }
    .robot-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;}
    .robot { font-size:20px; font-weight:700; }
    .prediction { font-weight:bold; padding:4px 10px; border-radius:20px; font-size:14px;}
    .row { display:flex; justify-content:space-between; padding:6px 0; color:#c9d1d9; font-size:14px; border-bottom: 1px solid #21262d;}
    .row:last-child { border-bottom: none; }
    .bar { height:8px; background:#30363d; border-radius:99px; overflow:hidden; margin:10px 0; }
    .fill { height:100%; background:#58a6ff; transition: width 0.3s; }
    .empty { padding:40px; text-align:center; color:#8b949e; border:1px dashed #30363d; border-radius:14px; }
    .badge-ok { color: #2ea043; }
    .badge-err { color: #f85149; }
  </style>
</head>
<body>
<header>
  <div>
    <h1>Cloud Fleet Dashboard</h1>
    <div class="tag">ACI606 · Operación</div>
  </div>
  <div class="status-bar">
    <div class="status-item" id="api-status">API: <span class="badge-err">Desconectada</span></div>
    <div class="status-item" id="metrics-status">Cargando métricas...</div>
  </div>
</header>
<main>
  <div id="cards" class="cards"></div>
</main>
<script>
const cards = document.getElementById('cards');
const apiStatusEl = document.getElementById('api-status');
const metricsStatusEl = document.getElementById('metrics-status');

// Función para obtener el color según la predicción
function getStatusColor(status) {
  if (status === 'NORMAL') return '#2ea043'; // Verde
  if (status === 'WARNING') return '#d29922'; // Amarillo
  if (status === 'CRITICAL') return '#f85149'; // Rojo
  return '#8b949e';
}

// Función para pedir la predicción al modelo
async function fetchPrediction(robot) {
  try {
    const res = await fetch('/predict', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(robot)
    });
    const data = await res.json();
    return data.predicted_status;
  } catch (e) {
    return 'ERROR';
  }
}

// Generar la tarjeta de cada robot
function card(r, status) {
  const battery = Math.max(0, Math.min(100, Number(r.battery)));
  const color = getStatusColor(status);
  
  return `<div class="card">
    <div class="robot-header">
      <div class="robot">${r.robot_id}</div>
      <div class="prediction" style="background:${color}20; color:${color}; border:1px solid ${color};">${status}</div>
    </div>
    <div class="row"><span>Battery</span><span>${battery.toFixed(1)} %</span></div>
    <div class="bar"><div class="fill" style="width:${battery}%; background:${battery < 20 ? '#f85149' : '#58a6ff'}"></div></div>
    <div class="row"><span>Speed</span><span>${Number(r.speed).toFixed(2)} m/s</span></div>
    <div class="row"><span>Motor temp.</span><span>${Number(r.motor_temp).toFixed(1)} °C</span></div>
    <div class="row"><span>Vibration</span><span>${Number(r.vibration).toFixed(2)}</span></div>
    <div class="row"><span>Obstacle</span><span>${Number(r.obstacle_distance).toFixed(2)} m</span></div>
  </div>`;
}

async function refresh() {
  try {
    // 1. Comprobar estado de la API
    const healthRes = await fetch('/health');
    if (healthRes.ok) {
        apiStatusEl.innerHTML = `API: <span class="badge-ok">Conectada</span>`;
    } else {
        apiStatusEl.innerHTML = `API: <span class="badge-err">Error</span>`;
    }

    // 2. Obtener métricas históricas
    const metricsRes = await fetch('/metrics');
    if (metricsRes.ok) {
        const metrics = await metricsRes.json();
        metricsStatusEl.textContent = `Predicciones: ${metrics.prediction_requests} | Uptime: ${Math.floor(metrics.uptime_seconds)}s`;
    }

    // 3. Obtener los robots
    const res = await fetch('/robots');
    const robots = await res.json();
    
    if (robots.length === 0) {
      cards.innerHTML = '<div class="empty">Ejecuta el simulador para comenzar a recibir robots.</div>';
      return;
    }

    // 4. Obtener predicciones para todos los robots en paralelo
    const predictions = await Promise.all(robots.map(r => fetchPrediction(r)));

    // 5. Renderizar tarjetas
    cards.innerHTML = robots.map((r, i) => card(r, predictions[i])).join('');

  } catch (err) {
    apiStatusEl.innerHTML = `API: <span class="badge-err">Desconectada</span>`;
    cards.innerHTML = '<div class="empty">Error de conexión con la API.</div>';
  }
}

// Ejecutar al cargar y luego cada 2 segundos
refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
